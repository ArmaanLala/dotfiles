# monitors
monitor=eDP-1,preferred,auto,auto
monitor=DP-1, 3840x2160@60.00Hz,0x0,auto
monitor=DP-2, 3840x2160@160.00Hz,auto,auto
# 2026-09-05: HDMI mirrors of DP-2 disabled while chasing the amdgpu display
# hang. crtc-2 is the pipe that wedges -- flip_done/commit-wait time out on it
# after a GPU reset and never recover, which is what turns a CS2 ring-hang into
# a frozen desktop (see ~/gpu-debug/). Mirroring a 4K@160 surface onto a 1080p
# HDMI pipe is the odd thing in this setup, so it goes first.
# To extend instead of disable:  monitor=HDMI-A-1,1920x1080@60,auto,auto
# To restore:                    monitor=HDMI-A-1,preferred,auto,auto,mirror,DP-2
monitor=HDMI-A-1,disable
monitor=HDMI-A-2,disable

# programs
$terminal = ghostty
$browser = firefox
$fileManager = nautilus
$menu = fuzzel

# autostart
exec-once = hyprctl setcursor phinger-cursors-dark 24
exec-once = waybar
exec-once = elephant
exec-once = /home/armaan/scripts/wallpaper.sh
exec-once = swayosd-server
# no hypridle here: services.hypridle is already on (pulled in by
# programs.hyprlock.enable), and its systemd user unit gives restart-on-failure,
# a curated PATH, and a clean stop on session exit. An exec-once ran a second
# copy that independently fired every listener (double dpms off, double suspend).

# environment
env = XCURSOR_SIZE,32
env = XCURSOR_THEME,phinger-cursors-dark
env = HYPRCURSOR_THEME,phinger-cursors-dark
env = HYPRCURSOR_SIZE,24
env = GDK_SCALE,2

xwayland {
  force_zero_scaling = true
}

# look and feel
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = -1
}

# input
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

# keybindings
$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

# focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, d

# lock (SHIFT+L, since plain SUPER+L is movefocus above)
# via logind, not hyprlock directly, so this shares hypridle's lock_cmd and its
# `pidof hyprlock` guard -- one lock path, and logind sees the session locked.
bind = $mainMod SHIFT, L, exec, loginctl lock-session

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# screenshots / capture
bind = $mainMod, S, exec, mkdir -p ~/Pictures/Screenshots && grimblast copysave area ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
# --freeze so the screen holds still while you drag the region; satty's
# --output-filename takes strftime specifiers directly, no $(date) needed.
bind = $mainMod SHIFT, S, exec, grimblast --freeze save area - | satty --filename - --output-filename ~/Pictures/Screenshots/satty-%Y-%m-%d_%H-%M-%S.png --early-exit all --copy-command wl-copy
bind = $mainMod, P, exec, hyprpicker -a
# toggle: SIGINT is what makes wl-screenrec finalise the mp4, so press again to stop
bind = $mainMod SHIFT, R, exec, pkill -INT wl-screenrec || (mkdir -p ~/Videos/Recordings && wl-screenrec --audio -g "$(slurp)" -f ~/Videos/Recordings/$(date +%Y-%m-%d_%H-%M-%S).mp4)

# scratchpad
# SUPER SHIFT S now belongs to satty. This half of the scratchpad was already
# orphaned -- the matching togglespecialworkspace bind was replaced by the
# screenshot bind above, so there was no way to view what you sent here.
# Uncomment both (on any free key) to bring the scratchpad back properly:
# bind = $mainMod, D, togglespecialworkspace, magic
# bind = $mainMod SHIFT, D, movetoworkspace, special:magic

# mouse
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# media keys
# swayosd-client both applies the change and draws the OSD, so it replaces
# wpctl/brightnessctl here rather than running alongside them.
# --max-volume 100 preserves the old `wpctl -l 1` cap.
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise --max-volume 100
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl  = ,Caps_Lock, exec, swayosd-client --caps-lock
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

