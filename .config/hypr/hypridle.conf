general {
    # Route the lock through logind so any lock trigger (this timer, a keybind
    # calling `loginctl lock-session`, or an external Lock() D-Bus call) ends
    # up running the same lock_cmd and only ever spawns one hyprlock.
    lock_cmd = pidof hyprlock || hyprlock
    # Only fires for a *deliberate* suspend (power menu, sleep key,
    # `systemctl suspend`) -- nothing here puts the machine to sleep on its own.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min -> displays off. Deliberately ahead of the lock: the monitors go dark
# first and hyprlock comes up behind them, so waking the screen lands straight
# on the lock screen instead of flashing the unlocked desktop.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 10 min -> lock. This is the last timer: idling never suspends the machine.
# bread is the box we ssh into, and S3 takes the NIC down with it.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
