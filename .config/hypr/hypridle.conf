general {
    # Route the lock through logind so any lock trigger (this timer, a keybind
    # calling `loginctl lock-session`, or an external Lock() D-Bus call) ends
    # up running the same lock_cmd and only ever spawns one hyprlock.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min -> lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min -> displays off (1 min after the lock kicks in)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 20 min -> suspend
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
