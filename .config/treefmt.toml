[global]
excludes = [
  ".git/**",
  "node_modules/**",
  ".direnv/**",
  "result/**",
  "target/**",
  "__pycache__/**",
  ".venv/**",
]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2021"]
includes = ["*.rs"]

[formatter.gofmt]
command = "gofmt"
options = ["-w"]
includes = ["*.go"]

[formatter.clang-format]
command = "clang-format"
options = ["-i"]
includes = ["*.c", "*.h", "*.cpp", "*.hpp", "*.cc", "*.cxx"]

[formatter.ruff-format]
command = "ruff"
options = ["format"]
includes = ["*.py"]

[formatter.stylua]
command = "stylua"
includes = ["*.lua"]

[formatter.shfmt]
command = "shfmt"
options = ["-w"]
includes = ["*.sh", "*.bash"]

[formatter.taplo]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

[formatter.yamlfmt]
command = "yamlfmt"
includes = ["*.yaml", "*.yml"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.json", "*.md"]
